<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Do'kon — Reboot Autotuning</title>
<meta name="description" content="Reboot Autotuning onlayn do'koni: polirovka, himoya va yuvish uchun avto kimyo va aksessuarlar.">
<meta name="theme-color" content="#0b0b0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="shop.css">
<script src="script.js"></script>
</head>
<body class="shop">

<div class="wrap">
  <div class="shop-bar">
    <a class="icon-btn" href="index.html" aria-label="Asosiy sahifaga qaytish">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <div class="shop-title">Do'kon</div>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Mavzuni almashtirish (qorong'i / yorug')" title="Mavzuni almashtirish">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>

  <div class="chips" id="chips" role="tablist" aria-label="Kategoriyalar"></div>

  <main>
    <div class="grid" id="grid"></div>
    <!-- DIQQAT: mahsulot nomlari va narxlar namuna. shop.js boshidagi PRODUCTS ro'yxatini o'zingizniki bilan almashtiring. -->
  </main>
</div>

<button class="cart-bar" id="cart-bar" type="button" hidden>
  <span class="cart-dot" aria-hidden="true"></span>
  <span class="cart-label">Savat <small id="cart-count"></small></span>
  <strong id="cart-total"></strong>
</button>

<dialog class="sheet" id="sheet">
  <form method="dialog" class="sheet-head">
    <h2 id="sheet-title">Savat</h2>
    <button class="icon-btn" aria-label="Yopish">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </form>

  <div id="view-cart">
    <ul class="lines" id="lines"></ul>
    <div class="total-row"><span>Jami</span><strong id="sum"></strong></div>

    <form id="order-form" novalidate>
      <label>Ismingiz
        <input name="name" type="text" autocomplete="name" required placeholder="Ismingiz">
      </label>
      <label>Telefon
        <input name="phone" type="tel" autocomplete="tel" inputmode="tel" required placeholder="+998 90 123 45 67">
      </label>
      <label><span>Manzil yoki izoh <span class="opt">(ixtiyoriy)</span></span>
        <textarea name="note" rows="2" placeholder="Yetkazib berish manzili yoki istak"></textarea>
      </label>

      <fieldset class="pay">
        <legend>To'lov usuli</legend>
        <label class="pay-opt"><input type="radio" name="pay" value="click" checked><span>Click</span></label>
        <label class="pay-opt"><input type="radio" name="pay" value="payme"><span>Payme</span></label>
        <label class="pay-opt"><input type="radio" name="pay" value="cash"><span>Naqd</span></label>
      </fieldset>

      <p class="form-error" id="form-error" role="alert" hidden></p>
      <button class="btn btn-primary submit" type="submit">Buyurtma berish</button>
    </form>
  </div>

  <div id="view-done" hidden>
    <div class="done-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
    </div>
    <h3>Buyurtma <span id="order-id"></span> tayyor</h3>
    <p class="done-text" id="done-text"></p>
    <a class="btn btn-primary submit" id="tg-link" href="#" target="_blank" rel="noopener">Telegramda yuborish</a>
    <a class="btn btn-ghost submit" id="pay-link" href="#" target="_blank" rel="noopener" hidden>To'lash</a>
    <button class="btn btn-ghost submit" id="done-close" type="button">Yopish</button>
  </div>
</dialog>

<script src="shop.js"></script>
</body>
</html>
